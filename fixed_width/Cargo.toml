[package]
name = "fixed_width"
version = "0.6.0"
authors = ["Tom King <twking7@gmail.com>"]
repository = "https://github.com/twking7/fixed_width"
description = "A fixed width data parser."
license = "MIT"
edition = "2018"
readme = "../README.md"

[dependencies]
serde = "1.0.198"
fixed_width_derive = { version = "0.6.0", optional = true, path = "../fixed_width_derive" }

[dev-dependencies]
fixed_width_derive = { path = "../fixed_width_derive" }
serde_bytes = "0.11"
serde_derive = "1.0.198"


[features]
default = []
derive = ["fixed_width_derive"]
